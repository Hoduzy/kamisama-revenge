<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Side Scroller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <!-- 글자 레이어: 대사·HUD 글자를 캔버스 위에 HTML 로 그린다 (js/ui.js) -->
  <div id="ui"></div>

  <!-- 터치 컨트롤 (터치 기기에서만 표시) -->
  <div id="touch-controls" aria-hidden="true">
    <div class="pad pad-left">
      <div class="btn" data-action="left">◀</div>
      <div class="btn" data-action="right">▶</div>
    </div>
    <div class="pad pad-skills">
      <div class="btn small skill" data-action="skill1">베기</div>
      <div class="btn small skill" data-action="skill2">발도</div>
    </div>
    <div class="pad pad-right">
      <div class="btn small" data-action="dash">DASH</div>
      <div class="btn small" data-action="attack">ATK</div>
      <div class="btn big" data-action="jump">JUMP</div>
    </div>
  </div>

  <script src="js/lib/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/level.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/story-engine.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/boot-scene.js"></script>
  <script src="js/game-scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
